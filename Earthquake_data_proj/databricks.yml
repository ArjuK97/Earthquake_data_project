# This is a Declarative Automation Bundle definition for Earthquake_data_proj.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: Earthquake_data_proj
  uuid: 1a8e4d35-9325-4d5d-a55c-43fb7523be91

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: WarehouseID

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-1c6ca54c-d19d.cloud.databricks.com
    variables:
      catalog: geo_proj
      schema: dev
      warehouse_id: 8399a73291bfd3c7
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-1c6ca54c-d19d.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/arzu.kundu@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/arzu.kundu@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: geo_proj_prod
      schema: prod
      warehouse_id: 8399a73291bfd3c7
    permissions:
      - user_name: arzu.kundu@gmail.com
        level: CAN_MANAGE
